services:
  - type: web
    name: voltgrid-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: HOLD_MINUTES
        value: 15
      - key: PIN_MAX_ATTEMPTS
        value: 5
      - key: CLIENT_ORIGIN
        sync: false
      - key: ALLOW_DEMO_RESET
        value: false
